{% include 'header.html' %}
<div class="panel-body">
    <div class='row'>
        <div class="col-sm-12">
            <div class="card">
                <div class="card-header bg-info text-white" style='font-size:17px;font-weight:bold;'>
                    {{ request.scope.get("route").name.replace("-"," ").capitalize() }}
                </div>
                <div class="card-body table-responsive">
                    <form action="#" method="GET" enctype="multipart/form-data">
                    <table class='table table-boardered'>
                        <tr>
                            <td style="width:300px;">
                                Select Fields
                            </td>
                            <td style="width:200px;">
                                Method
                            </td>
                            <td style="width:200px;">
                                Threshold
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>
                                <select name="field_name" class="form-control" required> 
                                {% for col in column %}
                                    <option value="{{col}}">{{col}}</option>
                                {% endfor %}
                                </select>   
                            </td>
                            <td>
                                <select name="method_name" class="form-control" required> 
                                    <option value="zscore">Z-Score</option>
                                    <option value="iqr">IQR</option>
                                    <option value="modified_zscore">Modified Z-Score</option>
                                </select>   
                            </td>
                            <td>
                                <input type="text" name="threshold" required value=0 >
                            </td>
                            <td>
                                <button type="submit" class="btn btn-success"> <i class="bi bi-play-btn"></i> RUN</button>
                            </td>
                        </tr>

                    </table>
                </form>


                   {{OutlierResult}}

                </div>
            </div>
        </div>
    </div>
</div>
{% include 'footer.html' %}
